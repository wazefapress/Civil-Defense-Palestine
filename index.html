  <!-- Modal تفاصيل الحالة ومشاركتها -->
  <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">

      <div class="modal-content rounded-4 border-0 shadow">
        
        <div class="modal-header border-0 pb-0 d-flex justify-content-between align-items-center">
          <h5 class="modal-title fw-bold fs-5" id="modalTitle">اسم الحالة</h5>
          
          <div class="d-flex align-items-center gap-2">
            <button type="button" class="btn btn-outline-success btn-sm rounded-pill px-3" onclick="shareCurrentCase()">

            <i class="bi bi-whatsapp me-1"></i> واتساب
          </button>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- التطبيق البرمجي المنفذ -->
  <script>
    let allCasesData = [];
    let currentCategory = 'all';
    let currentSearchTerm = '';
    let activeCase = null;

    const modal = new bootstrap.Modal(document.getElementById('detailModal'));

    // تسجيل الـ Service Worker لتقنية PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker Registered:', reg.scope))
          .catch((err) => console.error('Service Worker Failed:', err));
      });
    }

    // إدارة الوضع الليلي
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    const htmlElement = document.documentElement;

    function applyTheme(theme) {
      htmlElement.setAttribute('data-bs-theme', theme);
      localStorage.setItem('preferred-theme', theme);
      if (theme === 'dark') {
        themeIcon.className = 'bi bi-sun-fill fs-5 text-warning';
      } else {
        themeIcon.className = 'bi bi-moon-stars-fill fs-5 text-white';
      }
    }

    const savedTheme = localStorage.getItem('preferred-theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (savedTheme) {
      applyTheme(savedTheme);
    } else if (systemPrefersDark) {
      applyTheme('dark');
    } else {
      applyTheme('light');
    }

    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = htmlElement.getAttribute('data-bs-theme');
      applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
    });

    // جلب البيانات
    document.addEventListener('DOMContentLoaded', () => {
      fetch('data.json')
        .then(response => {
          if (!response.ok) throw new Error("تعذر تحميل البيانات");
          return response.json();
        })
        .then(data => {
          allCasesData = data;
          renderCases(allCasesData);
          setupCategoryEvents();
        })
        .catch(error => {
          console.error('خطأ:', error);
          document.getElementById('casesGrid').innerHTML = `
            <div class="col-12 text-center text-danger py-4">
              <i class="bi bi-exclamation-triangle fs-2"></i>
              <p class="mt-2 small">حدث خطأ أثناء تحميل بيانات الإسعافات الأولية.</p>
            </div>`;
        });
    });

    function renderCases(cases) {
      const grid = document.getElementById('casesGrid');
      grid.innerHTML = '';

      if (cases.length === 0) {
        grid.innerHTML = `
          <div class="col-12 text-center text-muted py-4">
            <i class="bi bi-search fs-2"></i>
            <p class="mt-2 small">لم يتم العثور على نتائج تطابق بحثك.</p>
          </div>`;
        return;
      }

      cases.forEach(item => {
        const col = document.createElement('div');
        col.className = 'col-6 col-md-4 col-lg-3';
        col.innerHTML = `
          <div class="card card-case h-100 p-2 p-md-3 shadow-sm text-center" onclick="showDetails('${item.id}')">
            <div class="icon-box bg-${item.badgeColor}-subtle text-${item.badgeColor} mx-auto mb-2">
              <i class="bi ${item.icon}"></i>
            </div>
            <h5 class="fw-bold mb-1 fs-6">${item.title}</h5>
            <span class="badge bg-${item.badgeColor}-subtle text-${item.badgeColor} rounded-pill w-auto mx-auto px-2 py-1">${item.badge}</span>
          </div>
        `;
        grid.appendChild(col);
      });
    }

    function applyFilters() {
      const term = currentSearchTerm.toLowerCase();

      const filtered = allCasesData.filter(item => {
        const matchesCategory = (currentCategory === 'all') ||
          item.category.includes(currentCategory) ||
          item.keywords.includes(currentCategory) ||
          (item.badge && item.badge.includes(currentCategory));

        const matchesSearch = !term ||
          item.title.toLowerCase().includes(term) ||
          item.category.toLowerCase().includes(term) ||
          item.keywords.some(k => k.toLowerCase().includes(term)) ||
          (item.symptoms && item.symptoms.some(s => s.toLowerCase().includes(term)));

        return matchesCategory && matchesSearch;
      });

      renderCases(filtered);
    }

    function setupCategoryEvents() {
      const buttons = document.querySelectorAll('#categoryFilter .btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', function() {
          buttons.forEach(b => {
            b.classList.remove('btn-danger', 'active');
            b.classList.add('btn-outline-danger');
          });
          this.classList.remove('btn-outline-danger');
          this.classList.add('btn-danger', 'active');
          currentCategory = this.getAttribute('data-category');
          applyFilters();
        });
      });
    }

    document.getElementById('searchInput').addEventListener('input', function(e) {
      currentSearchTerm = e.target.value.trim();
      applyFilters();
    });

    function showDetails(id) {
      const item = allCasesData.find(c => c.id === id);
      if (!item) return;

      activeCase = item;
      document.getElementById('modalTitle').innerText = item.title;

      let htmlContent = `
        <div class="mb-3">
          <h6 class="fw-bold text-secondary small"><i class="bi bi-activity me-1"></i> الأعراض والعلامات:</h6>
          <ul class="list-group list-group-flush ps-0 small">
            ${item.symptoms.map(s => `<li class="list-group-item bg-transparent py-1 border-0"><i class="bi bi-dot me-1"></i>${s}</li>`).join('')}
          </ul>
        </div>

        <div class="mb-3">
          <h6 class="fw-bold text-success small"><i class="bi bi-check-circle-fill me-1"></i> خطوات الإسعاف الأولية:</h6>
          <ol class="list-group list-group-numbered small">
            ${item.steps.map(step => `<li class="list-group-item border-0 bg-body-tertiary mb-1 rounded py-1">${step}</li>`).join('')}
          </ol>
        </div>

        <div class="alert alert-danger mb-0 rounded-3 py-2 small">
          <h6 class="fw-bold mb-1 small"><i class="bi bi-x-circle-fill me-1"></i> تحذيرات وأخطاء شائعة تجنبها:</h6>
          <ul class="mb-0 ps-3">
            ${item.donts.map(dont => `<li>${dont}</li>`).join('')}
          </ul>
        </div>
      `;

      document.getElementById('modalBody').innerHTML = htmlContent;
      modal.show();
    }

    function buildShareText(item) {
  let stepsText = item.steps.map((step, idx) => `${idx + 1}. ${step}`).join('\n');
  let dontsText = item.donts.map(dont => `• ${dont}`).join('\n');

  return `🚨 *إرشادات دفاع مدني طارئة: ${item.title}*\n\n` +
         `📋 *إجراءات السلامة:* \n${stepsText}\n\n` +
         `⚠️ *تحذيرات مهمة:* \n${dontsText}\n\n` +
         `📞 لطوارئ الدفاع المدني اتصل فوراً بـ: *102*\n` +
         `🔗 تم الإرسال من دليل طوارئ الدفاع المدني`;
}

    async function shareCurrentCase() {
      if (!activeCase) return;
      const shareData = {
        title: activeCase.title,
        text: buildShareText(activeCase),
        url: window.location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (err) {
          if (err.name !== 'AbortError') console.error('خطأ للمشاركة:', err);
        }
      } else {
        shareToWhatsAppDirect();
      }
    }

    function shareToWhatsAppDirect() {
      if (!activeCase) return;
      const text = buildShareText(activeCase);
      const encodedText = encodeURIComponent(text);
      window.open(`https://api.whatsapp.com/send?text=${encodedText}`, '_blank');
    }
    // ==================== إدارة تثبيت التطبيق (PWA Install Prompt) ====================
let deferredPrompt;
const installAppBtn = document.getElementById('installAppBtn');

// 1. الاستماع لحدث جاهزية التثبيت من المتصفح
window.addEventListener('beforeinstallprompt', (e) => {
  // منع إظهار شريط المتصفح الافتراضي
  e.preventDefault();
  // حفظ الحدث لاستدعائه عند النقر
  deferredPrompt = e;
  // إظهار زر التثبيت في الواجهة
  installAppBtn.classList.remove('d-none');
});

// 2. عند نقر المستخدم على زر التثبيت
installAppBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;

  // إظهار نافذة التثبيت الرسمية الخاصة بنظام التشغيل/المتصفح
  deferredPrompt.prompt();

  // انتظار خيار المستخدم (موافقة أو إلغاء)
  const { outcome } = await deferredPrompt.userChoice;
  console.log(`قرار المستخدم للتثبيت: ${outcome}`);

  // إعادة ضبط المتغير وإخفاء الزر
  deferredPrompt = null;
  installAppBtn.classList.add('d-none');
});

// 3. إخفاء الزر فور إتمام التثبيت بنجاح
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  // عرض الزر برمجياً بدون تعارض فئات Bootstrap
  installAppBtn.style.display = 'inline-flex'; 
});
  </script>
